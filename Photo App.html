<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Caption</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
min-height: 100vh;
background: #f0ede8;
display: flex;
flex-direction: column;
align-items: center;
padding: 48px 20px 80px;
font-family: ‘DM Sans’, sans-serif;
color: #1c1c1c;
}

h1 { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
.subtitle { font-size: 0.78rem; color: #888; margin-bottom: 36px; }

/* ── Drop zone ── */
.drop-zone {
width: min(560px, 100%);
border: 1.5px dashed #bbb;
border-radius: 8px;
padding: 48px 32px;
text-align: center;
cursor: pointer;
transition: border-color 0.2s, background 0.2s;
background: #faf9f7;
}
.drop-zone:hover, .drop-zone.dragover { border-color: #555; background: #f5f3f0; }
.drop-icon { font-size: 2.2rem; margin-bottom: 12px; display: block; }
.drop-label { font-size: 0.92rem; font-weight: 500; color: #333; margin-bottom: 4px; }
.drop-hint { font-size: 0.75rem; color: #aaa; }
#file-input { display: none; }

/* ── Options ── */
.options-panel {
width: min(560px, 100%);
margin-top: 20px;
display: none;
flex-direction: column;
gap: 12px;
}
.options-panel.visible { display: flex; }

.option-row { display: flex; align-items: center; gap: 12px; }
.opt-label {
font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em;
text-transform: uppercase; color: #888; width: 80px; flex-shrink: 0;
}
.text-input {
flex: 1; background: #fff; border: 1.5px solid #ddd; border-radius: 6px;
font-family: ‘DM Sans’, sans-serif; font-size: 0.84rem; color: #1c1c1c;
padding: 8px 12px; outline: none; transition: border-color 0.2s;
}
.text-input:focus { border-color: #555; }
.text-input::placeholder { color: #bbb; }

.file-count {
font-size: 0.78rem; color: #888; font-family: ‘DM Mono’, monospace;
}
.file-count strong { color: #333; }

.generate-btn {
font-family: ‘DM Sans’, sans-serif; font-size: 0.88rem; font-weight: 600;
color: #fff; background: #1c1c1c; border: none; border-radius: 6px;
padding: 11px 24px; cursor: pointer; align-self: flex-start;
transition: background 0.15s; letter-spacing: 0.02em;
}
.generate-btn:hover { background: #333; }
.generate-btn:disabled { background: #aaa; cursor: not-allowed; }

.status {
font-size: 0.75rem; color: #888; min-height: 18px;
font-family: ‘DM Mono’, monospace;
}
.status.error { color: #c0392b; }

/* ── Results grid ── */
.result-area {
margin-top: 48px;
width: min(1100px, 100%);
display: flex;
flex-direction: column;
gap: 48px;
}

.batch-header {
font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em;
text-transform: uppercase; color: #aaa;
padding-bottom: 12px;
border-bottom: 1px solid #ddd;
}

.photo-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 28px;
}

/* ── Photo card ── */
.photo-card {
background: #fff;
border-radius: 6px;
overflow: hidden;
box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 6px 24px rgba(0,0,0,0.06);
display: flex;
flex-direction: column;
}

.card-photo {
width: 100%; aspect-ratio: 4/3;
object-fit: cover; display: block;
background: #111;
}

.card-caption {
padding: 14px 16px 16px;
border-top: 1px solid #f0f0f0;
display: flex; flex-direction: column; gap: 4px;
flex: 1;
}

.caption-filename {
font-size: 0.68rem; color: #bbb; font-family: ‘DM Mono’, monospace;
margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.caption-location { font-size: 0.88rem; font-weight: 600; color: #1c1c1c; }
.caption-datetime {
font-family: ‘DM Mono’, monospace; font-size: 0.7rem; color: #888;
}
.caption-note { font-size: 0.76rem; color: #666; font-style: italic; margin-top: 2px; }
.caption-missing { font-size: 0.7rem; color: #e07b3a; font-family: ‘DM Mono’, monospace; }

/* processing state */
.card-processing {
display: flex; align-items: center; justify-content: center;
gap: 8px; padding: 14px 16px;
font-size: 0.75rem; color: #aaa; font-family: ‘DM Mono’, monospace;
}
.spinner {
width: 14px; height: 14px;
border: 2px solid #e0e0e0; border-top-color: #888;
border-radius: 50%; animation: spin 0.7s linear infinite;
flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.card-save-btn {
margin: 0 16px 14px;
font-family: ‘DM Sans’, sans-serif; font-size: 0.78rem; font-weight: 500;
color: #fff; background: #1c1c1c; border: none; border-radius: 5px;
padding: 9px 14px; cursor: pointer; transition: background 0.15s;
text-align: center;
}
.card-save-btn:hover { background: #333; }
.card-save-btn:disabled { background: #ccc; cursor: default; }

canvas { display: none; }
</style>

</head>
<body>

<h1>Photo Caption</h1>
<p class="subtitle">Adds location, date &amp; time from EXIF metadata · supports batch</p>

<div class="drop-zone" id="drop-zone">
  <span class="drop-icon">🖼️</span>
  <div class="drop-label">Drop photos here, or tap to browse</div>
  <div class="drop-hint">Select one or many · JPEG recommended · processed locally in your browser</div>
  <input type="file" id="file-input" accept="image/*" multiple>
</div>

<div class="options-panel" id="options-panel">
  <div class="file-count" id="file-count"></div>
  <div class="option-row">
    <span class="opt-label">Note</span>
    <input type="text" class="text-input" id="custom-note" placeholder="Optional note added to every photo…">
  </div>
  <button class="generate-btn" id="generate-btn">Generate captions</button>
  <div class="status" id="status"></div>
</div>

<div class="result-area" id="result-area"></div>
<canvas id="canvas"></canvas>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let pendingFiles = [];   // Array of File objects

// ── DOM ────────────────────────────────────────────────────────────────────────
const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const optPanel    = document.getElementById('options-panel');
const generateBtn = document.getElementById('generate-btn');
const statusEl    = document.getElementById('status');
const resultArea  = document.getElementById('result-area');
const fileCountEl = document.getElementById('file-count');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');

// ── File pick / drop ───────────────────────────────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  setFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => {
  setFiles([...fileInput.files].filter(f => f.type.startsWith('image/')));
});

function setFiles(files) {
  if (!files.length) return;
  pendingFiles = files;
  resultArea.innerHTML = '';
  const n = files.length;
  fileCountEl.innerHTML = `<strong>${n}</strong> photo${n !== 1 ? 's' : ''} selected`;
  optPanel.classList.add('visible');
  setStatus('');
}

// ── Generate all ───────────────────────────────────────────────────────────────
generateBtn.addEventListener('click', async () => {
  if (!pendingFiles.length) return;
  generateBtn.disabled = true;
  resultArea.innerHTML = '';

  const note = document.getElementById('custom-note').value.trim();
  const n    = pendingFiles.length;

  // Build grid
  const header = document.createElement('div');
  header.className = 'batch-header';
  header.textContent = `${n} photo${n !== 1 ? 's' : ''}`;
  resultArea.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'photo-grid';
  resultArea.appendChild(grid);

  // Create placeholder cards immediately so UI feels instant
  const cardRefs = pendingFiles.map((file, i) => {
    const card = createPlaceholderCard(file.name);
    grid.appendChild(card);
    return card;
  });

  setStatus(`Processing ${n} photo${n !== 1 ? 's' : ''}…`);

  // Process in parallel (geocoding throttled to avoid rate-limits)
  let done = 0;
  const geoQueue = [];  // serialize geocoding calls

  const promises = pendingFiles.map(async (file, i) => {
    try {
      const { dataURL, exif } = await readFile(file);

      // Date/time
      let dateStr, timeStr;
      if (exif.dateTimeRaw) {
        ({ dateStr, timeStr } = parseExifDate(exif.dateTimeRaw));
      } else {
        const d = new Date(file.lastModified);
        dateStr = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }

      // Location — queue to avoid hammering Nominatim
      let location = '';
      if (exif.lat !== undefined) {
        location = await enqueueGeocode(geoQueue, exif.lat, exif.lon);
      }

      populateCard(cardRefs[i], file.name, dataURL, exif, location, dateStr, timeStr, note);
      done++;
      setStatus(`Processing… ${done}/${n} done`);
    } catch (err) {
      cardRefs[i].innerHTML = `<div class="card-processing" style="color:#c0392b">⚠ ${file.name}: ${err.message}</div>`;
      done++;
      setStatus(`Processing… ${done}/${n} done`);
    }
  });

  await Promise.all(promises);
  setStatus(`Done — ${n} photo${n !== 1 ? 's' : ''} captioned.`);
  generateBtn.disabled = false;
});

// ── Placeholder card ───────────────────────────────────────────────────────────
function createPlaceholderCard(filename) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.innerHTML = `
    <div style="width:100%;aspect-ratio:4/3;background:#f0ede8;display:flex;align-items:center;justify-content:center;">
      <div style="font-size:2rem;opacity:0.3">🖼️</div>
    </div>
    <div class="card-processing"><div class="spinner"></div>Reading…</div>
  `;
  return card;
}

// ── Populate card once processed ───────────────────────────────────────────────
function populateCard(card, filename, dataURL, exif, location, dateStr, timeStr, note) {
  card.innerHTML = '';

  const img = document.createElement('img');
  img.className = 'card-photo';
  img.src = dataURL;
  img.alt = filename;

  const caption = document.createElement('div');
  caption.className = 'card-caption';

  const fnEl = document.createElement('div');
  fnEl.className = 'caption-filename';
  fnEl.textContent = filename;
  caption.appendChild(fnEl);

  const dtEl = document.createElement('div');
  dtEl.className = 'caption-datetime';
  dtEl.style.fontWeight = '600';
  dtEl.style.color = '#1c1c1c';
  dtEl.textContent = dateStr + (timeStr ? '  ·  ' + timeStr : '');
  caption.appendChild(dtEl);

  if (location) {
    const el = document.createElement('div');
    el.className = 'caption-location';
    el.textContent = '📍 ' + location;
    caption.appendChild(el);
  } else {
    const el = document.createElement('div');
    el.className = 'caption-missing';
    el.textContent = exif.lat !== undefined ? '⚠ Location lookup failed' : '⚠ No GPS data';
    caption.appendChild(el);
  }

  if (note) {
    const el = document.createElement('div');
    el.className = 'caption-note';
    el.textContent = note;
    caption.appendChild(el);
  }

  const saveBtn = document.createElement('button');
  saveBtn.className = 'card-save-btn';
  saveBtn.textContent = '📂 Open to save';
  saveBtn.addEventListener('click', () => {
    if (img.complete && img.naturalWidth > 0) {
      openFinalImage(img, location, dateStr, timeStr, note);
    } else {
      img.addEventListener('load', () => openFinalImage(img, location, dateStr, timeStr, note), { once: true });
    }
  });

  card.appendChild(img);
  card.appendChild(caption);
  card.appendChild(saveBtn);
}

// ── Read file → { dataURL, exif } ─────────────────────────────────────────────
function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Read failed'));
    reader.onload = e => {
      const buffer = e.target.result;
      let exif = {};
      try { exif = extractEXIF(buffer); } catch {}

      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunk = 8192;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      const dataURL = 'data:' + file.type + ';base64,' + btoa(binary);
      resolve({ dataURL, exif });
    };
    reader.readAsArrayBuffer(file);
  });
}

// ── Throttled geocoding queue (300ms between calls) ───────────────────────────
function enqueueGeocode(queue, lat, lon) {
  const task = () => reverseGeocode(lat, lon).catch(() => lat.toFixed(4) + '°, ' + lon.toFixed(4) + '°');
  if (!queue.length) {
    const p = task();
    queue.push(p);
    p.finally(() => { queue.shift(); });
    return p;
  }
  const last = queue[queue.length - 1];
  const p = last.finally(() => new Promise(r => setTimeout(r, 350))).then(task);
  queue.push(p);
  p.finally(() => { const idx = queue.indexOf(p); if (idx > -1) queue.splice(idx, 1); });
  return p;
}

// ── EXIF parser ────────────────────────────────────────────────────────────────
function extractEXIF(buffer) {
  const result = {};
  const view   = new DataView(buffer);
  if (view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) return result;

  let offset = 2;
  while (offset + 4 <= view.byteLength) {
    const marker = view.getUint16(offset);
    if (marker === 0xFFDA) break;
    if (marker === 0xFFE1) {
      try { parseAPP1(view, offset + 2, result); } catch {}
      break;
    }
    if ((marker & 0xFF00) !== 0xFF00) break;
    const segLen = view.getUint16(offset + 2);
    offset += 2 + segLen;
  }
  return result;
}

function parseAPP1(view, segStart, result) {
  if (view.getUint8(segStart + 2) !== 0x45 ||
      view.getUint8(segStart + 3) !== 0x78 ||
      view.getUint8(segStart + 4) !== 0x69 ||
      view.getUint8(segStart + 5) !== 0x66) return;
  const tiffBase  = segStart + 8;
  const le        = view.getUint16(tiffBase) === 0x4949;
  const ifd0Off   = view.getUint32(tiffBase + 4, le);
  parseIFD(view, tiffBase, tiffBase + ifd0Off, le, result);
}

function parseIFD(view, tiffBase, ifdStart, le, result) {
  if (ifdStart + 2 > view.byteLength) return;
  const count = view.getUint16(ifdStart, le);
  for (let i = 0; i < count; i++) {
    const e = ifdStart + 2 + i * 12;
    if (e + 12 > view.byteLength) break;
    const tag  = view.getUint16(e, le);
    const type = view.getUint16(e + 2, le);
    const num  = view.getUint32(e + 4, le);
    const sz   = typeByteSize(type) * num;
    const valOff = sz <= 4 ? e + 8 : tiffBase + view.getUint32(e + 8, le);
    if (tag === 0x9003 || (tag === 0x0132 && !result.dateTimeRaw)) {
      result.dateTimeRaw = readASCII(view, valOff, num);
    } else if (tag === 0x8769) {
      parseIFD(view, tiffBase, tiffBase + view.getUint32(e + 8, le), le, result);
    } else if (tag === 0x8825) {
      parseGPS(view, tiffBase, tiffBase + view.getUint32(e + 8, le), le, result);
    }
  }
}

function parseGPS(view, tiffBase, gpsStart, le, result) {
  if (gpsStart + 2 > view.byteLength) return;
  const count = view.getUint16(gpsStart, le);
  let latArr, lonArr, latRef = 'N', lonRef = 'E';
  for (let i = 0; i < count; i++) {
    const e   = gpsStart + 2 + i * 12;
    if (e + 12 > view.byteLength) break;
    const tag = view.getUint16(e, le);
    const num = view.getUint32(e + 4, le);
    const off = tiffBase + view.getUint32(e + 8, le);
    switch (tag) {
      case 1: latRef = String.fromCharCode(view.getUint8(e + 8)); break;
      case 3: lonRef = String.fromCharCode(view.getUint8(e + 8)); break;
      case 2: latArr = readRationals(view, off, num, le); break;
      case 4: lonArr = readRationals(view, off, num, le); break;
    }
  }
  if (latArr && lonArr && latArr.length >= 3 && lonArr.length >= 3) {
    result.lat = dms(latArr) * (latRef === 'S' ? -1 : 1);
    result.lon = dms(lonArr) * (lonRef === 'W' ? -1 : 1);
  }
}

function typeByteSize(t) { return [0,1,1,2,4,8,1,1,2,4,8,4,8][t] || 1; }

function readASCII(view, off, len) {
  let s = '';
  for (let i = 0; i < len && off + i < view.byteLength; i++) {
    const c = view.getUint8(off + i);
    if (c === 0) break;
    s += String.fromCharCode(c);
  }
  return s.trim();
}

function readRationals(view, off, count, le) {
  const vals = [];
  for (let i = 0; i < count; i++) {
    const base = off + i * 8;
    if (base + 8 > view.byteLength) break;
    const n = view.getUint32(base, le);
    const d = view.getUint32(base + 4, le);
    vals.push(d !== 0 ? n / d : 0);
  }
  return vals;
}

function dms([deg, min, sec]) { return deg + min / 60 + sec / 3600; }

// ── Helpers ────────────────────────────────────────────────────────────────────
function parseExifDate(raw) {
  const m = raw.match(/(\d{4})[:\-](\d{2})[:\-](\d{2})\s+(\d{2}):(\d{2}):?(\d{2})?/);
  if (!m) return { dateStr: raw, timeStr: '' };
  const d = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
  return {
    dateStr: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
    timeStr: d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
  };
}

async function reverseGeocode(lat, lon) {
  const r = await fetch(
    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=en`
  );
  if (!r.ok) throw new Error('geocoding failed');
  const data = await r.json();
  const a = data.address || {};
  const city   = a.city || a.town || a.village || a.hamlet || a.county || '';
  const region = a.state || a.region || '';
  return [city, region].filter(Boolean).join(', ');
}

function setStatus(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isErr ? ' error' : '');
}

// ── Overlay styles (injected once) ────────────────────────────────────────────
(function injectOverlayStyles() {
  const s = document.createElement('style');
  s.textContent = `
    #save-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.92);
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #save-overlay.active { display: flex; }
    #save-overlay .ov-hint {
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      color: #aaa; text-align: center; line-height: 1.7;
      padding: 20px 24px 12px; max-width: 380px;
    }
    #save-overlay .ov-hint strong { color: #fff; }
    #save-overlay img {
      width: 100%; max-width: 700px;
      height: auto; display: block;
    }
    #save-overlay .ov-close {
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      color: #1c1c1c; background: #fff; border: none; border-radius: 6px;
      padding: 11px 28px; margin: 16px 0 32px; cursor: pointer;
    }
    #save-overlay .ov-dl {
      font-family: 'DM Sans', sans-serif; font-size: 0.75rem;
      color: #666; text-decoration: underline; margin-bottom: 8px; cursor: pointer;
    }
  `;
  document.head.appendChild(s);

  // Build overlay DOM once
  const overlay = document.createElement('div');
  overlay.id = 'save-overlay';
  overlay.innerHTML = `
    <div class="ov-hint">
      <strong>Press and hold the image to save</strong><br>
      iPhone: Save to Photos &nbsp;·&nbsp; Android: Download image<br>
      <span style="color:#666;font-size:0.72rem">Desktop: right-click → Save image as…</span>
    </div>
    <img id="ov-img" src="" alt="Photo with caption">
    <a id="ov-dl" class="ov-dl" download="photo-with-caption.png">↓ Download (desktop)</a>
    <button class="ov-close" id="ov-close">✕ Close</button>
  `;
  document.body.appendChild(overlay);

  document.getElementById('ov-close').addEventListener('click', () => {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  });
})();

// ── Build & show final image ───────────────────────────────────────────────────
function openFinalImage(img, location, dateStr, timeStr, note) {
  const SIDE_PAD = 32;
  const LINE_H   = 38;
  const textLines = [];
  textLines.push({ text: dateStr + (timeStr ? '  ·  ' + timeStr : ''), style: 'datetime' });
  if (location) textLines.push({ text: '📍 ' + location, style: 'location' });
  if (note)     textLines.push({ text: note, style: 'note' });

  const STRIP_H = 24 + textLines.length * LINE_H + 16;
  const scale   = Math.min(1, 1400 / img.naturalWidth);
  const W       = Math.round(img.naturalWidth  * scale);
  const H       = Math.round(img.naturalHeight * scale);

  canvas.width  = W;
  canvas.height = H + STRIP_H;

  ctx.drawImage(img, 0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, H, W, STRIP_H);
  ctx.fillStyle = '#eeeeee';
  ctx.fillRect(0, H, W, 1);

  const baseSize = Math.max(14, Math.round(W * 0.022));
  let y = H + baseSize + 18;

  for (const { text, style } of textLines) {
    if (style === 'location') {
      ctx.font = `600 ${baseSize}px "Helvetica Neue", Arial, sans-serif`;
      ctx.fillStyle = '#1c1c1c';
    } else if (style === 'datetime') {
      ctx.font = `${Math.round(baseSize * 0.8)}px "Courier New", monospace`;
      ctx.fillStyle = '#888888';
    } else {
      ctx.font = `italic ${Math.round(baseSize * 0.85)}px "Helvetica Neue", Arial, sans-serif`;
      ctx.fillStyle = '#555555';
    }
    ctx.fillText(text, SIDE_PAD, y);
    y += LINE_H;
  }

  const dataURL = canvas.toDataURL('image/png');

  // Show in overlay — no new tab, no popup, works on iOS
  const ovImg = document.getElementById('ov-img');
  const ovDl  = document.getElementById('ov-dl');
  ovImg.src   = dataURL;
  ovDl.href   = dataURL;
  document.getElementById('save-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0, 0);
}
</script>
